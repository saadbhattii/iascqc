<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#375b87"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect 
    x="2" 
    y="2" 
    width="60" 
    height="60" 
    rx="14" 
    fill="url(#silver)" 
    stroke="#3c3c3c" 
    stroke-width="0"/>

  <!-- Center stem -->
  <rect 
    x="30" 
    y="10" 
    width="4" 
    height="44" 
    fill="#334155"/>

  <!-- Plates -->
  <rect 
    x="12" 
    y="14" 
    width="40" 
    height="6" 
    rx="2" 
    fill="url(#gold)" 
    stroke="#854d0e" 
    stroke-width="1.5"/>

  <rect 
    x="17" 
    y="24" 
    width="30" 
    height="6" 
    rx="2" 
    fill="url(#gold)" 
    stroke="#854d0e" 
    stroke-width="1.5"/>

  <rect 
    x="22" 
    y="34" 
    width="20" 
    height="6" 
    rx="2" 
    fill="url(#gold)" 
    stroke="#854d0e" 
    stroke-width="1.5"/>

  <!-- New smaller bottom plate -->
  <rect 
    x="25" 
    y="44" 
    width="14" 
    height="6" 
    rx="2" 
    fill="url(#gold)" 
    stroke="#854d0e" 
    stroke-width="1.5"/>

</svg>
